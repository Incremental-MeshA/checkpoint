<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Planning time · car16</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#fff;color:#191919;font:17px/1.44 "Times New Roman",Times,"Liberation Serif",serif}
main{max-width:1200px;margin:auto;padding:45px clamp(18px,4vw,64px) 60px}
h1,h2,p,figure{margin:0}
.intro{text-align:center;border-bottom:1px solid #393939;padding-bottom:17px}
h1{font-size:clamp(30px,3.3vw,43px);font-weight:normal;line-height:1.14}
.meta{margin-top:7px;font-size:16px;font-style:italic}
.tools{display:flex;align-items:baseline;justify-content:center;flex-wrap:wrap;gap:6px 12px;margin:15px 0;font-size:15px}
label{font-weight:bold}select{font:inherit;color:inherit;background:white;border:1px solid #999;padding:2px 5px;max-width:100%}
h2{font-size:22px;line-height:1.23;margin:23px 0 9px}
.tables,.charts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(20px,3vw,42px);align-items:start}
figure{min-width:0;break-inside:avoid}.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;border-block:1.5px solid #242424;font-size:15px;line-height:1.22;font-variant-numeric:tabular-nums}
th,td{padding:4px 5px;text-align:right;white-space:nowrap}
thead{border-bottom:1px solid #444}thead th{font-weight:normal}
thead th[colspan]{text-align:center;border-bottom:1px solid #aaa}
thead th[rowspan],tbody th,.graph{text-align:left}tbody th{font-weight:normal}
tbody tr:nth-child(2n+3)>*{border-top:1px solid #ccc}
figcaption{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:7px 0 0;font-size:15px;line-height:1.28}
figcaption strong{font-weight:bold}.downloads{white-space:nowrap}
.export{font:13px/1.2 "Times New Roman",Times,serif;color:#333;text-decoration:underline;text-underline-offset:2px}
.export+.export{margin-left:7px}.export:hover{color:#184d87}select:focus-visible,.export:focus-visible{outline:2px solid #184d87;outline-offset:2px}
.scenario{margin-top:25px}.scenario h2{border-bottom:1px solid #aaa;padding-bottom:5px;margin-bottom:12px}
.diagnostics figure{max-width:920px;margin:18px auto 28px}.diagnostics figcaption{align-items:baseline}
figure img{display:block;width:100%;height:auto}
[hidden]{display:none!important}
@media(max-width:970px){.tables{grid-template-columns:1fr}}
@media(max-width:720px){main{padding-top:24px}.charts{grid-template-columns:1fr}.tools{justify-content:flex-start}th,td{padding:4px 3px}}
@page{size:A4;margin:15mm}
@media print{main{max-width:none;padding:0}.tools select,.tools label,.downloads{display:none}.intro{padding-bottom:7pt}
h1{font-size:21pt}h2{font-size:13pt;break-after:avoid}.meta,.tools{font-size:10pt}
.tables,.charts{grid-template-columns:repeat(2,minmax(0,1fr));gap:6mm}table{font-size:8pt}th,td{padding:2pt 1pt}
thead th[colspan]{white-space:normal}.scroll{overflow:visible}figcaption{font-size:9pt}}
</style>
<main><div class="intro"><h1>Planning Time Comparison</h1><p class="meta">car16 · lattice and mesh · {{COUNT}} episodes in matched comparisons</p></div>
<div class="tools"><label for="base">Baseline</label><select id="base"><option value="same">A* on the same graph</option><option value="lattice">Lattice A* for all algorithms</option></select>
<span>Speedup = mean A* time / mean algorithm time. Values above 1× indicate faster planning.</span></div>
<h2 class="section-title">Mean time per episode</h2>
{{CONTENT}}</main>
<script>
const baseline=document.getElementById("base");
function showBaseline(){for(const panel of document.querySelectorAll("[data-base]")) panel.hidden=panel.dataset.base!==baseline.value;}
baseline.addEventListener("change",showBaseline);showBaseline();
</script></html>
